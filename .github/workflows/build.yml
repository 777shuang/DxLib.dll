name: Build

on:
  push:
    branches: [ "main", "development/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-mingw-dynamic
      # Native Windows build tools can run as host tools; only the target
      # libraries need to use MinGW.
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MinGW-w64
      uses: egor-tensin/setup-mingw@v3
      with:
        platform: x64

    - name: setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        project-path: .

    - name: Install required packages
      run: xmake require

    - name: Determine DxLib source version
      id: dxlib-version
      shell: pwsh
      run: |
        $content = (Get-Content -Path "dxlib-version.txt" -Raw)
        "version=$content" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Restore DxLib source cache
      id: cache-dxlib-sources
      uses: actions/cache/restore@v4
      with:
        path: |
          DxLibMake.zip
          DxLibMake/
        # No restore-keys here: never reuse source files from another DxLib version.
        key: ${{ runner.os }}-dxlib-${{ steps.dxlib-version.outputs.version }}

    - name: Download DxLib sources
      shell: pwsh
      run: |
        # Explicitly bind xmake to this checkout so a cached or inherited project
        # directory cannot hide the custom task declared in the local xmake.lua.
        xmake -y download-dxlib
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: Save DxLib source cache
      if: success() && steps.cache-dxlib-sources.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          DxLibMake.zip
          DxLibMake/
        key: ${{ runner.os }}-dxlib-${{ steps.dxlib-version.outputs.version }}

    - name: Build
      shell: pwsh
      run: |
        $compiler = Get-Command "x86_64-w64-mingw32-g++" -ErrorAction SilentlyContinue
        if ($null -ne $compiler) {
          $compilerPath = $compiler.Source
        } else {
          $compilerPath = "C:\ProgramData\mingw64\mingw64\bin\x86_64-w64-mingw32-g++.exe"
          if (-not (Test-Path $compilerPath)) {
            throw "Could not locate x86_64-w64-mingw32-g++."
          }
        }
        $mingwBin = Split-Path $compilerPath -Parent
        $mingwRoot = Split-Path $mingwBin -Parent

        # Avoid accidentally picking Unix utilities bundled with Git or other
        # software during native Windows/vcpkg builds.
        $cleanPath = ($env:PATH -split ';' | Where-Object {
          $_ -and
          (Test-Path (Join-Path $_ "sh.exe")) -eq $false -and
          (Test-Path (Join-Path $_ "bash.exe")) -eq $false -and
          (Test-Path (Join-Path $_ "msys-2.0.dll")) -eq $false -and
          (Test-Path (Join-Path $_ "cygwin1.dll")) -eq $false
        }) -join ';'
        $env:PATH = "$mingwBin;$cleanPath"

        xmake f -p mingw -a x86_64 "--mingw=$mingwRoot" -c -y
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
        # Limit compiler concurrency on hosted Windows runners and retain detailed diagnostics.
        xmake -v -j2 -y
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }


    - name: Upload DLLs
      uses: actions/upload-artifact@v4
      with:
        name: DxLib.dll
        path: build/*.dll
        if-no-files-found: error

    - name: Upload Import Library
      uses: actions/upload-artifact@v4
      with:
        name: DxLib.lib
        path: build/DxLib.lib
        if-no-files-found: error
