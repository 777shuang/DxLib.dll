name: Build

on:
  push:
    branches: [ "main", "development/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-mingw-dynamic
      VCPKG_DEFAULT_HOST_TRIPLET: x64-linux

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install xmake
      run: |
        curl -fsSL https://xmake.io/shget.text | bash
        source "$HOME/.xmake/profile"
        command -v xmake
        xmake --version
        echo "$(dirname "$(command -v xmake)")" >> "$GITHUB_PATH"

    - name: Install MinGW-w64 cross compiler
      run: |
        sudo apt-get update
        sudo apt-get install --yes g++-mingw-w64-x86-64

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
        "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "$RUNNER_TEMP/vcpkg" >> "$GITHUB_PATH"
        echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

    - name: Build
      run: |
        xmake f -p mingw -a x86_64 --mingw=/usr -c -y
        xmake -y

    - name: Upload DLLs
      uses: actions/upload-artifact@v4
      with:
        name: DxLib.dll
        path: build/*.dll
        if-no-files-found: error

    - name: Upload Import Library
      uses: actions/upload-artifact@v4
      with:
        name: DxLib.lib
        path: build/DxLib.lib
        if-no-files-found: error
